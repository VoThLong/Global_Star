<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 AI Studio Monitor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #333; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #444; }
        .status-container { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #f44336; transition: background-color 0.3s; }
        .status-dot.connected { background-color: #4caf50; box-shadow: 0 0 10px #4caf50; }
        .log-container { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; background-color: #111; }
        .log-line { display: flex; gap: 10px; border-bottom: 1px solid #222; padding: 2px 0; }
        .log-time { color: #888; min-width: 160px; }
        .log-content { white-space: pre-wrap; word-break: break-all; }
        .type-cmd { color: #569cd6; font-weight: bold; }
        .type-log { color: #ce9178; }
        .input-container { background-color: #252526; padding: 10px 20px; display: flex; gap: 10px; border-top: 1px solid #444; }
        input { flex: 1; background-color: #3c3c3c; border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 4px; outline: none; }
        input:focus { border-color: #007acc; }
        button { background-color: #007acc; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #0062a3; }
        .clear-btn { background-color: #d83b01; }
        .clear-btn:hover { background-color: #a32d01; }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-size: 18px; font-weight: bold;">ESP32 Serial Monitor</div>
        <div class="status-container">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">Connecting...</span>
            <a href="/history-view" target="_blank" style="color: #007acc; text-decoration: none; font-size: 14px; margin-left: 15px;">View Full History</a>
        </div>
    </div>

    <div class="log-container" id="logArea"></div>

    <div class="input-container">
        <input type="text" id="cmdInput" placeholder="Type command here (e.g. AT+CSQ)..." autocomplete="off">
        <button id="sendBtn">Send</button>
        <button id="clearBtn" class="clear-btn">Clear View</button>
    </div>

    <script>
        const BASE_URL = window.location.origin;
        const POLL_INTERVAL_MS = 500; 

        const logArea = document.getElementById('logArea');
        const cmdInput = document.getElementById('cmdInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        const seenLogs = new Set(); 
        let lastClearId = 0; 
        let isFirstPoll = true; 
        let commandMap = {}; 

        function updateStatus(serverOnline, esp32Online, lastSeen) {
            statusDot.classList.remove('connected');
            statusDot.style.backgroundColor = '#f44336'; 
            statusDot.style.boxShadow = 'none';

            if (serverOnline) {
                if (esp32Online) {
                    statusDot.classList.add('connected');
                    statusDot.style.backgroundColor = '#4caf50'; 
                    statusText.textContent = `ESP32 Online`;
                } else {
                    statusDot.style.backgroundColor = '#ffeb3b'; 
                    statusDot.style.boxShadow = '0 0 5px #ffeb3b';
                    statusText.textContent = `ESP32 Offline (${lastSeen || '?'}s ago)`;
                }
            } else {
                statusText.textContent = 'Server Offline';
            }
        }

        function getLocalTimestamp() {
            const now = new Date();
            return now.toISOString().replace('T', ' ').substring(0, 19);
        }

        function appendLog(id, type, content, timestamp) {
            if (id && seenLogs.has(id)) return;
            if (id && id <= lastClearId) return;
            if (id) seenLogs.add(id);

            if (content.startsWith('__ACK__:')) {
                const cmdId = content.split(':')[1];
                if (commandMap[cmdId]) {
                    commandMap[cmdId].style.color = '#4caf50'; 
                }
                return;
            }

            let responseId = null;
            let displayContent = content;
            if (type === 'log') {
                const resMatch = content.match(/^\[(\d+)\] (.*)/);
                if (resMatch) {
                    responseId = resMatch[1];
                    displayContent = resMatch[2];
                }
            }

            const line = document.createElement('div');
            line.className = `log-line type-${type}`;
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = `[${timestamp || getLocalTimestamp()}]`;
            
            const prefix = (type === 'cmd') ? '>> ' : '<< ';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'log-content';
            
            if (type === 'cmd' && content.startsWith('[#')) {
                const match = content.match(/^\[#(\d+)\] (.*)/);
                if (match) {
                    const cmdId = match[1];
                    displayContent = match[2];
                    commandMap[cmdId] = line;
                }
            }
            
            contentSpan.textContent = prefix + displayContent;

            if (responseId && commandMap[responseId]) {
                line.style.borderLeft = '3px solid #4caf50';
                line.style.paddingLeft = '10px';
                line.style.backgroundColor = 'rgba(76, 175, 80, 0.1)';
            }

            line.appendChild(timeSpan);
            line.appendChild(contentSpan);
            logArea.appendChild(line);

            logArea.scrollTop = logArea.scrollHeight;
        }

        async function sendCommand() {
            const cmdText = cmdInput.value.trim();
            if (!cmdText) return;
            cmdInput.value = '';

            try {
                const response = await fetch(`${BASE_URL}/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmdText })
                });

                if (!response.ok) throw new Error('Command failed');
                updateStatus(true);
                pollLogs(); 
            } catch (error) {
                console.error('Error sending command:', error);
                updateStatus(false);
            }
        }

        async function pollLogs() {
            try {
                const [logRes, statusRes] = await Promise.all([
                    fetch(`${BASE_URL}/logs`),
                    fetch(`${BASE_URL}/status`)
                ]);

                if (!logRes.ok || !statusRes.ok) throw new Error('Poll failed');
                
                const logs = await logRes.json();
                const status = await statusRes.json();
                
                updateStatus(true, status.esp32 === 'online', status.lastSeenSecondsAgo);
                
                if (Array.isArray(logs) && logs.length > 0) {
                    if (isFirstPoll) {
                        isFirstPoll = false;
                    }
                    logs.forEach(log => {
                        appendLog(log.id, log.type, log.content, log.timestamp);
                    });
                }
            } catch (error) {
                console.error('Error polling logs:', error);
                updateStatus(false, false, 0);
            }
        }

        sendBtn.addEventListener('click', sendCommand);
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendCommand();
        });

        clearBtn.addEventListener('click', () => {
            if (seenLogs.size > 0) {
                lastClearId = Math.max(...seenLogs);
            }
            logArea.innerHTML = '';
            seenLogs.clear();
        });

        setInterval(pollLogs, POLL_INTERVAL_MS);
        pollLogs();
    </script>
</body>
</html>
